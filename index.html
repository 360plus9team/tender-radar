<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tender Radar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f7f8; --surface: #ffffff; --text: #1c2230; --muted: #6b7280;
    --border: #e7e8ec; --accent: #ec1b34; --accent-soft: #fde7ea;
    --navy: #2e3192; --navy-soft: #eaeaf7; --gold: #d99a2b;
    --sans: 'Inter', -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111319; --surface: #191c24; --text: #eceef3; --muted: #949aab;
      --border: #262a35; --accent: #ff4f63; --accent-soft: #2c1820;
      --navy: #7c80e0; --navy-soft: #1e2040; --gold: #e7b656;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; color: var(--text); font-family: var(--sans);
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
    background-color: var(--bg);
    background-image:
      radial-gradient(600px circle at 100% 0%, rgba(236,27,52,0.05), transparent 60%),
      radial-gradient(600px circle at 0% 100%, rgba(217,154,43,0.06), transparent 60%);
    background-attachment: fixed;
  }
  #root { max-width: 1080px; margin: 0 auto; padding: 32px 20px 64px; }

  header { display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 12px; margin-bottom: 28px; }
  .header-left { display: flex; align-items: center; gap: 14px; }
  #logo { height: 34px; width: auto; }
  h1 { font-size: 23px; font-weight: 700; margin: 0; }
  .gold-rule { width: 46px; height: 3px; background: var(--gold); border-radius: 2px; margin: 7px 0 6px 0; }
  #subtitle { color: var(--muted); font-size: 13px; }

  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 26px; }
  .stat-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 28px 24px;
    cursor: pointer; transition: box-shadow 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
  }
  .stat-card:hover { border-color: var(--accent); transform: translateY(-1px); }
  .stat-card.active {
    border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); background: var(--accent-soft);
  }
  .stat-num { font-size: 42px; font-weight: 700; line-height: 1; color: var(--accent); }
  .stat-label { color: var(--muted); font-size: 14px; margin-top: 12px; font-weight: 500; }

  @media (max-width: 480px) {
    .stat-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }
    .stat-card { padding: 14px 12px; border-radius: 10px; }
    .stat-num { font-size: 26px; }
    .stat-label { font-size: 11.5px; margin-top: 5px; }
  }

  .panels { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; margin-bottom: 24px; align-items: start; }
  @media (max-width: 720px) {
    .panels { grid-template-columns: 1fr; }
    .panel-search { order: 2; }
    .panel-dept { order: 1; }
  }

  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
  .panel h2 { font-size: 13px; font-weight: 600; color: var(--muted); margin: 0 0 12px 0; text-transform: none; }

  .controls { display: flex; gap: 10px; flex-wrap: wrap; }
  #search {
    flex: 1; min-width: 180px; padding: 9px 12px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 13.5px;
  }
  #sortSelect {
    padding: 9px 12px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg);
    color: var(--text); font-family: var(--sans); font-size: 13.5px;
  }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .dept-table td, .dept-table th { padding: 7px 4px; text-align: left; border-bottom: 1px solid var(--border); }
  .dept-table th { color: var(--muted); font-weight: 600; font-size: 11.5px; }
  .dept-table td.count { text-align: right; font-weight: 600; }
  #deptTableWrap { max-height: 260px; overflow-y: auto; }

  #tenderTableWrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; }
  #tenderTable { width: 100%; border-collapse: collapse; font-size: 13.5px; min-width: 640px; }
  #tenderTable th {
    text-align: left; padding: 10px 14px; color: var(--muted); font-weight: 600; font-size: 11.5px;
    border-bottom: 1px solid var(--border); white-space: nowrap;
  }
  #tenderTable td { padding: 12px 14px; border-bottom: 1px solid var(--border); vertical-align: top; }
  #tenderTable tr:last-child td { border-bottom: none; }
  .t-title { font-weight: 600; max-width: 360px; }
  .t-title a { color: var(--text); text-decoration: none; }
  .t-title a:hover { color: var(--navy); }
  .badge {
    display: inline-block; font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 999px;
    background: var(--navy-soft); color: var(--navy); white-space: nowrap;
  }
  .closing { white-space: nowrap; }
  .doc-link {
    display: inline-block; font-size: 12.5px; font-weight: 600; color: var(--accent); text-decoration: none;
    white-space: nowrap;
  }
  .doc-link:hover { text-decoration: underline; }

  #filterStatus { display: flex; align-items: center; gap: 8px; }
  #filterStatus a { color: var(--accent); font-weight: 600; cursor: pointer; text-decoration: none; }
  #filterStatus a:hover { text-decoration: underline; }
  #loading, #error, #empty { padding: 60px 16px; color: var(--muted); text-align: center; }
</style>
</head>
<body>
<div id="root">
  <header>
    <div class="header-left">
      <img id="logo" src="verse-logo.png" alt="VerSe logo">
      <div>
        <h1>Tender Radar</h1>
        <div class="gold-rule"></div>
        <div id="subtitle">Loading&hellip;</div>
      </div>
    </div>
  </header>

  <div id="loading">Fetching the latest tenders.</div>
  <div id="error" style="display:none;"></div>

  <div id="dashboard" style="display:none;">
    <div class="stat-grid" id="statGrid"></div>

    <div class="panels">
      <div class="panel panel-search">
        <h2>Search &amp; sort</h2>
        <div class="controls">
          <input id="search" type="text" placeholder="Search by title, department, or category&hellip;">
          <select id="sortSelect">
            <option value="priority">Priority (West Bengal first)</option>
            <option value="closing">Closing date (soonest first)</option>
            <option value="published">Published date (newest first)</option>
          </select>
        </div>
      </div>
      <div class="panel panel-dept">
        <h2>Tenders by department</h2>
        <div id="deptTableWrap">
          <table class="dept-table">
            <thead><tr><th>Department</th><th style="text-align:right;">Count</th></tr></thead>
            <tbody id="deptTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <div id="filterStatus" style="display:none; margin-bottom:10px; font-size:13px; color:var(--muted);"></div>
    <div id="tenderTableWrap">
      <table id="tenderTable">
        <thead>
          <tr>
            <th>Tender</th>
            <th>Department</th>
            <th>Closing</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tenderTableBody"></tbody>
      </table>
    </div>
    <div id="empty" style="display:none;">No tenders match your search.</div>
  </div>
</div>

<script>
  // Change this to whatever password you want colleagues to use.
  // This is a light gate, not real security, anyone who reads this
  // file's code can see the password too.
  var SITE_PASSWORD = "qwertyasdf";

  (function checkAccess() {
    if (sessionStorage.getItem('tr_unlocked') === 'yes') return;
    var entered = prompt('Enter the Tender Radar password:');
    if (entered !== SITE_PASSWORD) {
      document.body.innerHTML =
        '<div style="text-align:center; padding:80px 16px; font-family:sans-serif; color:#888;">' +
        'Incorrect password. Refresh this page to try again.</div>';
      throw new Error('access denied');
    }
    sessionStorage.setItem('tr_unlocked', 'yes');
  })();

  // ---- Config ----
  var DATA_URL = "data/tenders.json";

  var CATEGORIES = [
    { key: 'empanelment', label: 'Empanelment', match: ['empanelment'] },
    { key: 'social', label: 'Social Media', match: ['social media'] },
    { key: 'event', label: 'Event', match: ['event management', 'event'] },
    { key: 'advertising', label: 'Advertising & Publicity', match: ['advertising', 'advertisement', 'publicity', 'press'] },
  ];

  var ALL_TENDERS = [];
  var currentCategory = 'all';

  var CATEGORY_LABELS = {
    all: 'Relevant tenders',
    empanelment: 'Empanelment tenders',
    social: 'Social media tenders',
    event: 'Event tenders',
    advertising: 'Advertising & publicity',
    other: 'Other relevant tenders',
  };

  function categorize(t) {
    var text = ((t.title || '') + ' ' + (t.category || '')).toLowerCase();
    for (var i = 0; i < CATEGORIES.length; i++) {
      var cat = CATEGORIES[i];
      for (var j = 0; j < cat.match.length; j++) {
        if (text.indexOf(cat.match[j]) !== -1) return cat.key;
      }
    }
    return 'other';
  }

  function sourcePriority(source) {
    if (!source) return 3;
    if (source.indexOf('WB') === 0) return 0;
    if (source === 'ONGC') return 1;
    if (source === 'HPCL') return 2;
    return 3;
  }

  function parseDateFlexible(str) {
    if (!str) return null;
    var m = String(str).match(/(\d{1,2})-([A-Za-z]{3})-(\d{4})\s+(\d{1,2}):(\d{2})\s*([AP]M)/i);
    if (m) {
      var months = { Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11 };
      var hour = parseInt(m[4], 10);
      if (/pm/i.test(m[6]) && hour < 12) hour += 12;
      if (/am/i.test(m[6]) && hour === 12) hour = 0;
      return new Date(parseInt(m[3],10), months[m[2]], parseInt(m[1],10), hour, parseInt(m[5],10));
    }
    var m2 = String(str).match(/(\d{4})-(\d{2})-(\d{2})/);
    if (m2) return new Date(parseInt(m2[1],10), parseInt(m2[2],10) - 1, parseInt(m2[3],10));
    return null;
  }

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }

  function renderStats(tenders) {
    var counts = { total: tenders.length, empanelment: 0, social: 0, event: 0, advertising: 0, other: 0 };
    tenders.forEach(function (t) { counts[categorize(t)]++; });

    var cards = [
      { key: 'all', num: counts.total, label: CATEGORY_LABELS.all },
      { key: 'empanelment', num: counts.empanelment, label: CATEGORY_LABELS.empanelment },
      { key: 'social', num: counts.social, label: CATEGORY_LABELS.social },
      { key: 'event', num: counts.event, label: CATEGORY_LABELS.event },
      { key: 'advertising', num: counts.advertising, label: CATEGORY_LABELS.advertising },
      { key: 'other', num: counts.other, label: CATEGORY_LABELS.other },
    ];
    var grid = document.getElementById('statGrid');
    grid.innerHTML = cards.map(function (c) {
      var activeClass = (c.key === currentCategory) ? ' active' : '';
      return '<div class="stat-card' + activeClass + '" data-key="' + c.key + '">' +
        '<div class="stat-num">' + c.num + '</div><div class="stat-label">' + c.label + '</div></div>';
    }).join('');
  }

  function updateStatCardActiveStates() {
    document.querySelectorAll('.stat-card').forEach(function (card) {
      card.classList.toggle('active', card.getAttribute('data-key') === currentCategory);
    });
  }

  function renderDeptTable(tenders) {
    var counts = {};
    tenders.forEach(function (t) {
      var s = t.source || 'Unknown';
      counts[s] = (counts[s] || 0) + 1;
    });
    var rows = Object.keys(counts).map(function (s) { return { source: s, count: counts[s] }; });
    rows.sort(function (a, b) { return b.count - a.count; });

    var body = document.getElementById('deptTableBody');
    body.innerHTML = rows.map(function (r) {
      return '<tr><td>' + escapeHtml(r.source) + '</td><td class="count">' + r.count + '</td></tr>';
    }).join('');
  }

  function sortTenders(tenders, mode) {
    var copy = tenders.slice();
    if (mode === 'closing') {
      copy.sort(function (a, b) {
        var da = parseDateFlexible(a.closingDate), db = parseDateFlexible(b.closingDate);
        if (da && db) return da - db;
        if (da) return -1;
        if (db) return 1;
        return 0;
      });
    } else if (mode === 'published') {
      copy.sort(function (a, b) {
        var da = parseDateFlexible(a.publishedDate || a.uploadedOn), db = parseDateFlexible(b.publishedDate || b.uploadedOn);
        if (da && db) return db - da;
        if (da) return -1;
        if (db) return 1;
        return 0;
      });
    } else {
      copy.sort(function (a, b) {
        var pa = sourcePriority(a.source), pb = sourcePriority(b.source);
        if (pa !== pb) return pa - pb;
        var da = parseDateFlexible(a.closingDate), db = parseDateFlexible(b.closingDate);
        if (da && db) return da - db;
        if (da) return -1;
        if (db) return 1;
        return 0;
      });
    }
    return copy;
  }

  function updateFilterStatus() {
    var statusEl = document.getElementById('filterStatus');
    if (currentCategory === 'all') {
      statusEl.style.display = 'none';
      return;
    }
    statusEl.style.display = 'flex';
    statusEl.innerHTML = 'Showing: <strong>' + CATEGORY_LABELS[currentCategory] + '</strong> &nbsp;&middot;&nbsp; <a id="clearFilter">Clear filter</a>';
    document.getElementById('clearFilter').addEventListener('click', function () {
      currentCategory = 'all';
      updateStatCardActiveStates();
      renderTenderTable();
    });
  }

  function renderTenderTable() {
    updateFilterStatus();
    var searchTerm = document.getElementById('search').value.trim().toLowerCase();
    var sortMode = document.getElementById('sortSelect').value;

    var filtered = ALL_TENDERS.filter(function (t) {
      if (currentCategory !== 'all' && categorize(t) !== currentCategory) return false;
      if (!searchTerm) return true;
      var haystack = ((t.title || '') + ' ' + (t.source || '') + ' ' + (t.category || '')).toLowerCase();
      return haystack.indexOf(searchTerm) !== -1;
    });

    var sorted = sortTenders(filtered, sortMode);

    var body = document.getElementById('tenderTableBody');
    var emptyEl = document.getElementById('empty');

    if (!sorted.length) {
      body.innerHTML = '';
      emptyEl.style.display = 'block';
      return;
    }
    emptyEl.style.display = 'none';

    body.innerHTML = sorted.map(function (t) {
      var docLink = t.link
        ? '<a class="doc-link" href="' + escapeHtml(t.link) + '" target="_blank">View / Download &#8599;</a>'
        : '';
      return '<tr>' +
        '<td class="t-title"><a href="detail.html?id=' + encodeURIComponent(t.id) + '">' + escapeHtml(t.title || 'Untitled tender') + '</a></td>' +
        '<td><span class="badge">' + escapeHtml(t.source || 'Unknown') + '</span></td>' +
        '<td class="closing">' + escapeHtml(t.closingDate || '—') + '</td>' +
        '<td>' + docLink + '</td>' +
        '</tr>';
    }).join('');
  }

  function showError(message) {
    document.getElementById('loading').style.display = 'none';
    var errorEl = document.getElementById('error');
    errorEl.style.display = 'block';
    errorEl.textContent = message;
  }

  fetch(DATA_URL)
    .then(function (res) {
      if (!res.ok) throw new Error('Could not load tender data (status ' + res.status + ')');
      return res.json();
    })
    .then(function (data) {
      ALL_TENDERS = data.tenders || [];
      var updated = data.last_updated ? new Date(data.last_updated).toLocaleString() : '';
      document.getElementById('subtitle').textContent =
        ALL_TENDERS.length + ' relevant tender' + (ALL_TENDERS.length === 1 ? '' : 's') +
        (updated ? ', last updated ' + updated : '');

      document.getElementById('loading').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';

      renderStats(ALL_TENDERS);
      renderDeptTable(ALL_TENDERS);
      renderTenderTable();

      document.getElementById('search').addEventListener('input', renderTenderTable);
      document.getElementById('sortSelect').addEventListener('change', renderTenderTable);

      document.getElementById('statGrid').addEventListener('click', function (e) {
        var card = e.target.closest('.stat-card');
        if (!card) return;
        var key = card.getAttribute('data-key');
        currentCategory = (currentCategory === key) ? 'all' : key;
        updateStatCardActiveStates();
        renderTenderTable();
      });
    })
    .catch(function (err) {
      showError('Could not load tenders: ' + err.message);
    });
</script>
</body>
</html>
