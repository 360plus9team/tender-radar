<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tender Radar</title>
<style>
  :root {
    --bg: #f7f7f8; --card-bg: #ffffff; --text: #1a1a1a; --muted: #888888; --accent: #111111; --tag-bg: #eef2ff; --tag-text: #3730a3;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16161a; --card-bg: #212126; --text: #f2f2f2; --muted: #9a9a9a; --accent: #f2f2f2; --tag-bg: #2a2a3a; --tag-text: #c7d2fe;
    }
  }
  html, body {
    height: 100%; margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  #root { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; box-sizing: border-box; }
  h1 { font-size: 22px; margin: 0 0 4px 0; }
  #subtitle { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  #loading, #error, #empty { text-align: center; padding: 80px 16px; color: var(--muted); }
  .card {
    display: block; background: var(--card-bg); border-radius: 12px; padding: 16px;
    margin-bottom: 12px; text-decoration: none; color: var(--text);
  }
  .card-title { font-size: 15px; font-weight: 700; margin-bottom: 8px; line-height: 1.4; }
  .card-meta { display: flex; flex-wrap: wrap; gap: 8px; font-size: 12px; color: var(--muted); }
  .tag {
    background: var(--tag-bg); color: var(--tag-text); padding: 3px 10px; border-radius: 999px; font-weight: 600;
  }
</style>
</head>
<body>
<div id="root">
  <h1>Tender Radar</h1>
  <div id="subtitle">Loading...</div>
  <div id="loading">Loading tenders...</div>
  <div id="error" style="display:none;"></div>
  <div id="empty" style="display:none;">No relevant tenders found right now, check back after the next scrape.</div>
  <div id="list"></div>
</div>

<script>
  // Change this to whatever password you want colleagues to use.
  // This is a light gate, not real security, anyone who reads this
  // file's code can see the password too.
  var SITE_PASSWORD = "qwertyasdf";

  (function checkAccess() {
    if (sessionStorage.getItem('tr_unlocked') === 'yes') return;
    var entered = prompt('Enter the Tender Radar password:');
    if (entered !== SITE_PASSWORD) {
      document.body.innerHTML =
        '<div style="text-align:center; padding:80px 16px; font-family:sans-serif; color:#888;">' +
        'Incorrect password. Refresh this page to try again.</div>';
      throw new Error('access denied');
    }
    sessionStorage.setItem('tr_unlocked', 'yes');
  })();

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }

  function renderList(tenders) {
    document.getElementById('loading').style.display = 'none';

    if (!tenders.length) {
      document.getElementById('empty').style.display = 'block';
      return;
    }

    var listEl = document.getElementById('list');
    tenders.forEach(function (t) {
      var card = document.createElement('a');
      card.className = 'card';
      card.href = 'detail.html?id=' + encodeURIComponent(t.id);

      var metaParts = [];
      if (t.source) metaParts.push('<span class="tag">' + escapeHtml(t.source) + '</span>');
      if (t.closingDate) metaParts.push('<span>Closes: ' + escapeHtml(t.closingDate) + '</span>');
      if (t.category) metaParts.push('<span>' + escapeHtml(t.category) + '</span>');

      card.innerHTML =
        '<div class="card-title">' + escapeHtml(t.title || 'Untitled tender') + '</div>' +
        '<div class="card-meta">' + metaParts.join('') + '</div>';

      listEl.appendChild(card);
    });
  }

  function showError(message) {
    document.getElementById('loading').style.display = 'none';
    var errorEl = document.getElementById('error');
    errorEl.style.display = 'block';
    errorEl.textContent = message;
  }

  fetch('data/tenders.json')
    .then(function (res) {
      if (!res.ok) throw new Error('Could not load tender data (status ' + res.status + ')');
      return res.json();
    })
    .then(function (data) {
      var tenders = data.tenders || [];
      var updated = data.last_updated ? new Date(data.last_updated).toLocaleString() : '';
      document.getElementById('subtitle').textContent =
        tenders.length + ' relevant tender' + (tenders.length === 1 ? '' : 's') +
        (updated ? ', last updated ' + updated : '');
      renderList(tenders);
    })
    .catch(function (err) {
      showError('Could not load tenders: ' + err.message);
    });
</script>
</body>
</html>
