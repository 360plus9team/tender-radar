<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tender Details</title>
<style>
  :root {
    --bg: #f7f7f8;
    --card-bg: #ffffff;
    --text: #1a1a1a;
    --muted: #888888;
    --accent: #111111;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16161a;
      --card-bg: #212126;
      --text: #f2f2f2;
      --muted: #9a9a9a;
      --accent: #f2f2f2;
    }
  }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  #root {
    max-width: 720px;
    margin: 0 auto;
    padding: 24px 16px 48px;
    box-sizing: border-box;
  }
  #loading, #error {
    text-align: center;
    padding: 80px 16px;
    color: var(--muted);
  }
  .box {
    background: var(--card-bg);
    border-radius: 10px;
    padding: 12px;
  }
  .label {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.02em;
    margin-bottom: 4px;
  }
  .value {
    font-size: 14px;
    font-weight: 600;
  }
  a.button {
    display: block;
    text-align: center;
    margin-top: 16px;
    background: var(--accent);
    color: var(--bg);
    text-decoration: none;
    padding: 14px;
    border-radius: 10px;
    font-weight: 600;
    font-size: 14px;
  }
</style>
</head>
<body>
<div id="root">
  <div id="loading">Loading tender...</div>
  <div id="error" style="display:none;"></div>
  <div id="content" style="display:none;">

    <div style="display:flex; flex-direction:column; gap:10px; margin-bottom:20px;">
      <span id="t-source" class="box" style="align-self:flex-start; font-size:12px; font-weight:600; padding:6px 12px; border-radius:999px;"></span>
      <h1 id="t-title" style="font-size:22px; line-height:1.35; margin:0; font-weight:700;"></h1>
    </div>

    <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap:10px; margin-bottom:20px;">
      <div class="box"><div class="label">CLOSING DATE</div><div id="t-closing" class="value">—</div></div>
      <div class="box"><div class="label">EMD AMOUNT</div><div id="t-emd" class="value">—</div></div>
      <div class="box"><div class="label">CATEGORY</div><div id="t-category" class="value">—</div></div>
    </div>

    <div id="timeline-section" style="margin-bottom:22px;">
      <h2 style="font-size:15px; font-weight:700; margin:0 0 12px 0;">Timeline</h2>
      <div id="timeline" style="border-left:2px solid var(--muted); padding-left:16px;"></div>
    </div>

    <div id="desc-section" style="margin-bottom:22px;">
      <h2 style="font-size:15px; font-weight:700; margin:0 0 8px 0;">Work Description</h2>
      <p id="t-desc" style="font-size:14px; line-height:1.6; margin:0;">—</p>
    </div>

    <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap:10px;">
      <div class="box" style="flex:1;"><div class="label">LOCATION</div><div id="t-location" class="value">—</div></div>
      <div class="box" style="flex:1;"><div class="label">TENDER ID</div><div id="t-id" class="value">—</div></div>
    </div>

    <a id="t-link" href="#" target="_blank" class="button">View Original Tender</a>
  </div>
</div>

<script>
  // WIX_ENDPOINT is set below, once we know your site's real address.
  var WIX_ENDPOINT = "https://360plus9.com/_functions/getTenderById";

  function showField(id, value, fallback) {
    var el = document.getElementById(id);
    el.textContent = (value && String(value).trim()) ? value : (fallback || 'Not available');
  }

  function addTimelineStep(label, value) {
    if (!value) return;
    var timeline = document.getElementById('timeline');
    var step = document.createElement('div');
    step.style.marginBottom = '14px';
    step.style.position = 'relative';
    var dot = document.createElement('div');
    dot.style.cssText = 'position:absolute; left:-21px; top:3px; width:9px; height:9px; border-radius:50%; background:var(--muted);';
    var labelEl = document.createElement('div');
    labelEl.style.cssText = 'font-size:12px; color:var(--muted);';
    labelEl.textContent = label;
    var valueEl = document.createElement('div');
    valueEl.style.cssText = 'font-size:14px; font-weight:600;';
    valueEl.textContent = value;
    step.appendChild(dot);
    step.appendChild(labelEl);
    step.appendChild(valueEl);
    timeline.appendChild(step);
  }

  function render(item) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('content').style.display = 'block';

    showField('t-title', item.title, 'Untitled tender');
    showField('t-source', item.source, '');
    showField('t-closing', item.closingDate, 'Not specified');
    showField('t-emd', item.emdAmount ? ('\u20b9' + item.emdAmount) : '', 'Not specified');
    showField('t-category', item.category, 'Not specified');
    showField('t-location', item.location || item.venue, 'Not specified');
    showField('t-id', item.tenderId, 'Not specified');
    showField('t-desc', item.workDescription || item.title, 'No description available for this tender.');

    document.getElementById('t-link').setAttribute('href', item.link || '#');

    addTimelineStep('Published', item.publishedDate || item.uploadedOn);
    addTimelineStep('Document Download Ends', item.downloadEndDate);
    addTimelineStep('Bid Submission Ends', item.submissionEndDate);
    addTimelineStep('Bid Opening', item.bidOpeningDate);

    if (!document.getElementById('timeline').children.length) {
      document.getElementById('timeline-section').style.display = 'none';
    }
  }

  function showError(message) {
    document.getElementById('loading').style.display = 'none';
    var errorEl = document.getElementById('error');
    errorEl.style.display = 'block';
    errorEl.textContent = message;
  }

  var params = new URLSearchParams(window.location.search);
  var tenderId = params.get('id');

  // Fall back to reading it from the URL fragment (the part after #)
  // if it's not in the query string. Fragments are handled purely by
  // the browser and never touched by any server or hosting layer in
  // between, which makes them more reliable in some hosting setups.
  if (!tenderId && window.location.hash) {
    var hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ''));
    tenderId = hashParams.get('id');
  }

  if (!tenderId) {
    showError('No tender specified. Open this page via a link from your tender list.');
  } else {
    fetch(WIX_ENDPOINT + '?id=' + encodeURIComponent(tenderId))
      .then(function (res) {
        if (!res.ok) throw new Error('Server responded with ' + res.status);
        return res.json();
      })
      .then(function (data) {
        if (data.error) {
          showError(data.error);
        } else {
          render(data);
        }
      })
      .catch(function (err) {
        showError('Could not load this tender: ' + err.message);
      });
  }
</script>
</body>
</html>
