<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tender Radar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1c2333;
    --ink-light: #545f70;
    --paper: #eef0ec;
    --card: #fbfbf8;
    --accent: #9a7526;
    --accent-deep: #6f5416;
    --line: #d5d6cb;
    --serif: 'Source Serif 4', Georgia, serif;
    --sans: 'IBM Plex Sans', -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #eef0ec;
      --ink-light: #a6ada0;
      --paper: #13161d;
      --card: #1a1e27;
      --accent: #d3a94a;
      --accent-deep: #e7c377;
      --line: #2b2f3a;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%; margin: 0; background: var(--paper); color: var(--ink);
    font-family: var(--sans);
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  #root { max-width: 720px; margin: 0 auto; padding: 40px 20px 64px; }

  header { margin-bottom: 28px; padding-bottom: 20px; border-bottom: 1px solid var(--line); }
  h1 {
    font-family: var(--serif); font-weight: 600; font-size: 30px; margin: 0 0 6px 0; letter-spacing: -0.01em;
  }
  #subtitle { color: var(--ink-light); font-size: 14px; }

  #loading, #error, #empty {
    padding: 60px 16px; color: var(--ink-light); font-size: 15px; line-height: 1.6;
  }

  #list { display: flex; flex-direction: column; }

  .entry {
    display: flex; gap: 18px; align-items: flex-start; padding: 18px 4px;
    border-bottom: 1px solid var(--line); text-decoration: none; color: inherit;
  }
  .entry:hover .entry-title { color: var(--accent-deep); }
  .entry:hover .stub { border-color: var(--accent); }

  .stub {
    flex-shrink: 0; width: 64px; text-align: center; padding: 8px 4px;
    border: 1px solid var(--line); border-radius: 4px; font-family: var(--sans);
  }
  .stub-day { font-size: 19px; font-weight: 600; line-height: 1.1; }
  .stub-month { font-size: 11px; color: var(--ink-light); margin-top: 2px; }

  .entry-body { flex: 1; min-width: 0; }
  .entry-title {
    font-family: var(--serif); font-size: 16px; font-weight: 600; line-height: 1.4; margin-bottom: 6px;
  }
  .entry-meta { font-size: 13px; color: var(--ink-light); display: flex; flex-wrap: wrap; gap: 4px 10px; }
  .entry-meta .tag { color: var(--accent-deep); font-weight: 600; }
  .entry-meta span:not(:last-child)::after { content: '·'; margin-left: 10px; color: var(--line); }
</style>
</head>
<body>
<div id="root">
  <header>
    <h1>Tender Radar</h1>
    <div id="subtitle">Loading&hellip;</div>
  </header>
  <div id="loading">Fetching the latest tenders.</div>
  <div id="error" style="display:none;"></div>
  <div id="empty" style="display:none;">No relevant tenders on record right now. Check back after the next scrape, or widen the keywords in keywords.txt if this seems too quiet.</div>
  <div id="list"></div>
</div>

<script>
  // Change this to whatever password you want colleagues to use.
  // This is a light gate, not real security, anyone who reads this
  // file's code can see the password too.
  var SITE_PASSWORD = "qwertyasdf";

  (function checkAccess() {
    if (sessionStorage.getItem('tr_unlocked') === 'yes') return;
    var entered = prompt('Enter the Tender Radar password:');
    if (entered !== SITE_PASSWORD) {
      document.body.innerHTML =
        '<div style="text-align:center; padding:80px 16px; font-family:sans-serif; color:#888;">' +
        'Incorrect password. Refresh this page to try again.</div>';
      throw new Error('access denied');
    }
    sessionStorage.setItem('tr_unlocked', 'yes');
  })();

  var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  function parseStub(dateStr) {
    // Tries to pull a day + month out of whatever date format the
    // source gave us (e.g. "05-Oct-2026 12:30 PM" or "2026-07-21").
    // Falls back to a plain dash if it can't make sense of it.
    if (!dateStr) return { day: '—', month: '' };
    var match = String(dateStr).match(/(\d{1,2})[-\s]([A-Za-z]{3})/);
    if (match) return { day: match[1], month: match[2] };
    var iso = String(dateStr).match(/(\d{4})-(\d{2})-(\d{2})/);
    if (iso) return { day: String(parseInt(iso[3], 10)), month: MONTHS[parseInt(iso[2], 10) - 1] };
    return { day: '—', month: '' };
  }

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }

  function renderList(tenders) {
    document.getElementById('loading').style.display = 'none';

    if (!tenders.length) {
      document.getElementById('empty').style.display = 'block';
      return;
    }

    var listEl = document.getElementById('list');
    tenders.forEach(function (t) {
      var stub = parseStub(t.closingDate);
      var entry = document.createElement('a');
      entry.className = 'entry';
      entry.href = 'detail.html?id=' + encodeURIComponent(t.id);

      var metaParts = [];
      if (t.source) metaParts.push('<span class="tag">' + escapeHtml(t.source) + '</span>');
      if (t.category) metaParts.push('<span>' + escapeHtml(t.category) + '</span>');
      if (t.closingDate) metaParts.push('<span>Closes ' + escapeHtml(t.closingDate) + '</span>');

      entry.innerHTML =
        '<div class="stub"><div class="stub-day">' + escapeHtml(stub.day) + '</div>' +
        '<div class="stub-month">' + escapeHtml(stub.month) + '</div></div>' +
        '<div class="entry-body">' +
        '<div class="entry-title">' + escapeHtml(t.title || 'Untitled tender') + '</div>' +
        '<div class="entry-meta">' + metaParts.join('') + '</div>' +
        '</div>';

      listEl.appendChild(entry);
    });
  }

  function showError(message) {
    document.getElementById('loading').style.display = 'none';
    var errorEl = document.getElementById('error');
    errorEl.style.display = 'block';
    errorEl.textContent = message;
  }

  fetch('data/tenders.json')
    .then(function (res) {
      if (!res.ok) throw new Error('Could not load tender data (status ' + res.status + ')');
      return res.json();
    })
    .then(function (data) {
      var tenders = data.tenders || [];
      var updated = data.last_updated ? new Date(data.last_updated).toLocaleString() : '';
      document.getElementById('subtitle').textContent =
        tenders.length + ' relevant tender' + (tenders.length === 1 ? '' : 's') +
        (updated ? ', last updated ' + updated : '');
      renderList(tenders);
    })
    .catch(function (err) {
      showError('Could not load tenders: ' + err.message);
    });
</script>
</body>
</html>
