<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tender Details</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f7f8; --surface: #ffffff; --text: #1c2230; --muted: #6b7280;
    --border: #e7e8ec; --accent: #ec1b34; --accent-soft: #fde7ea;
    --navy: #2e3192; --navy-soft: #eaeaf7; --gold: #d99a2b;
    --sans: 'Inter', -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111319; --surface: #191c24; --text: #eceef3; --muted: #949aab;
      --border: #262a35; --accent: #ff4f63; --accent-soft: #2c1820;
      --navy: #7c80e0; --navy-soft: #1e2040; --gold: #e7b656;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%; margin: 0; color: var(--text); font-family: var(--sans);
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
    background-color: var(--bg);
    background-image:
      radial-gradient(600px circle at 100% 0%, rgba(236,27,52,0.05), transparent 60%),
      radial-gradient(600px circle at 0% 100%, rgba(217,154,43,0.06), transparent 60%);
    background-attachment: fixed;
  }
  #root { max-width: 680px; margin: 0 auto; padding: 32px 20px 64px; }
  #loading, #error { padding: 80px 16px; color: var(--muted); text-align: center; }

  .header-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  #logo { height: 26px; width: auto; }

  a.back {
    display: inline-flex; align-items: center; gap: 6px; margin-bottom: 20px;
    color: var(--muted); text-decoration: none; font-size: 13px;
  }
  a.back:hover { color: var(--accent); }

  .tag {
    display: inline-block; font-size: 12px; font-weight: 600; color: var(--navy);
    background: var(--navy-soft); border-radius: 999px; padding: 4px 12px; margin-bottom: 14px;
  }
  h1 { font-weight: 700; font-size: 24px; line-height: 1.35; margin: 0 0 8px 0; }
  .gold-rule { width: 46px; height: 3px; background: var(--gold); border-radius: 2px; margin: 0 0 24px 0; }

  .facts { border-top: 1px solid var(--border); margin-bottom: 28px; background: var(--surface); border-radius: 10px 10px 0 0; }
  .fact {
    display: flex; justify-content: space-between; gap: 16px; padding: 13px 14px;
    border-bottom: 1px solid var(--border); font-size: 14px;
  }
  .fact .flabel { color: var(--muted); }
  .fact .fvalue { font-weight: 600; text-align: right; }

  h2 {
    font-family: var(--sans); font-size: 13px; font-weight: 600; letter-spacing: 0.02em;
    color: var(--muted); margin: 0 0 14px 0;
  }
  section { margin-bottom: 28px; }

  #timeline { position: relative; padding-left: 20px; }
  #timeline::before {
    content: ''; position: absolute; left: 4px; top: 4px; bottom: 4px; width: 1px; background: var(--border);
  }
  .step { position: relative; margin-bottom: 16px; }
  .step:last-child { margin-bottom: 0; }
  .step-dot {
    position: absolute; left: -20px; top: 4px; width: 9px; height: 9px; border-radius: 50%;
    background: var(--accent); border: 2px solid var(--bg);
  }
  .step-label { font-size: 12px; color: var(--muted); }
  .step-value { font-size: 14px; font-weight: 600; }

  #t-desc { font-size: 15px; line-height: 1.7; color: var(--text); margin: 0; }

  a.button {
    display: block; text-align: center; margin-top: 8px; background: var(--accent); color: #fff;
    text-decoration: none; padding: 15px; border-radius: 8px; font-weight: 600; font-size: 14px;
  }
  a.button:hover { background: var(--navy); }
</style>
</head>
<body>
<div id="root">
  <div class="header-bar"><img id="logo" src="verse-logo.png" alt="VerSe logo"></div>
  <div id="loading">Loading tender&hellip;</div>
  <div id="error" style="display:none;"></div>
  <div id="content" style="display:none;">
    <a class="back" href="index.html">&larr; Back to all tenders</a>

    <div id="t-source" class="tag"></div>
    <h1 id="t-title"></h1>
    <div class="gold-rule"></div>

    <div class="facts">
      <div class="fact"><span class="flabel">Closing date</span><span id="t-closing" class="fvalue">—</span></div>
      <div class="fact"><span class="flabel">Published date</span><span id="t-published" class="fvalue">—</span></div>
      <div class="fact"><span class="flabel">EMD amount</span><span id="t-emd" class="fvalue">—</span></div>
      <div class="fact"><span class="flabel">Tender value</span><span id="t-value" class="fvalue">—</span></div>
      <div class="fact"><span class="flabel">Category</span><span id="t-category" class="fvalue">—</span></div>
      <div class="fact"><span class="flabel">Location</span><span id="t-location" class="fvalue">—</span></div>
      <div class="fact"><span class="flabel">Tender ID</span><span id="t-id" class="fvalue">—</span></div>
    </div>

    <section id="timeline-section">
      <h2>Timeline</h2>
      <div id="timeline"></div>
    </section>

    <section id="desc-section">
      <h2>Work description</h2>
      <p id="t-desc">—</p>
    </section>

    <a id="t-link" href="#" target="_blank" class="button">View original tender</a>
  </div>
</div>

<script>
  // Change this to whatever password you want colleagues to use.
  // This is a light gate, not real security, anyone who reads this
  // file's code can see the password too.
  var SITE_PASSWORD = "qwertyasdf";

  (function checkAccess() {
    if (sessionStorage.getItem('tr_unlocked') === 'yes') return;
    var entered = prompt('Enter the Tender Radar password:');
    if (entered !== SITE_PASSWORD) {
      document.body.innerHTML =
        '<div style="text-align:center; padding:80px 16px; font-family:sans-serif; color:#888;">' +
        'Incorrect password. Refresh this page to try again.</div>';
      throw new Error('access denied');
    }
    sessionStorage.setItem('tr_unlocked', 'yes');
  })();

  function showField(id, value, fallback) {
    var el = document.getElementById(id);
    el.textContent = (value && String(value).trim()) ? value : (fallback || 'Not available');
  }

  function addTimelineStep(label, value) {
    if (!value) return;
    var timeline = document.getElementById('timeline');
    var step = document.createElement('div');
    step.className = 'step';
    var dot = document.createElement('div');
    dot.className = 'step-dot';
    var labelEl = document.createElement('div');
    labelEl.className = 'step-label';
    labelEl.textContent = label;
    var valueEl = document.createElement('div');
    valueEl.className = 'step-value';
    valueEl.textContent = value;
    step.appendChild(dot);
    step.appendChild(labelEl);
    step.appendChild(valueEl);
    timeline.appendChild(step);
  }

  function render(item) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('content').style.display = 'block';

    showField('t-title', item.title, 'Untitled tender');
    showField('t-source', item.source, 'Unknown source');
    showField('t-closing', item.closingDate, 'Not specified');
    showField('t-published', item.publishedDate || item.uploadedOn, 'Not specified');
    showField('t-emd', item.emdAmount ? ('\u20b9' + item.emdAmount) : '', 'Not specified');
    showField('t-value', (item.tenderValue && item.tenderValue !== 'NA') ? ('\u20b9' + item.tenderValue) : '', 'Not specified');
    showField('t-category', item.category, 'Not specified');
    showField('t-location', item.location || item.venue, 'Not specified');
    showField('t-id', item.tenderId, 'Not specified');
    showField('t-desc', item.workDescription || item.title, 'No description available for this tender.');

    document.getElementById('t-link').setAttribute('href', item.link || '#');

    addTimelineStep('Published', item.publishedDate || item.uploadedOn);
    addTimelineStep('Document download ends', item.downloadEndDate);
    addTimelineStep('Bid submission ends', item.submissionEndDate);
    addTimelineStep('Bid opening', item.bidOpeningDate);

    if (!document.getElementById('timeline').children.length) {
      document.getElementById('timeline-section').style.display = 'none';
    }
  }

  function showError(message) {
    document.getElementById('loading').style.display = 'none';
    var errorEl = document.getElementById('error');
    errorEl.style.display = 'block';
    errorEl.textContent = message;
  }

  var params = new URLSearchParams(window.location.search);
  var tenderId = params.get('id');

  if (!tenderId) {
    showError('No tender specified. Open this page via a link from your tender list.');
  } else {
    fetch('data/tenders.json')
      .then(function (res) {
        if (!res.ok) throw new Error('Could not load tender data (status ' + res.status + ')');
        return res.json();
      })
      .then(function (data) {
        var match = (data.tenders || []).find(function (t) { return t.id === tenderId; });
        if (match) {
          render(match);
        } else {
          showError('Tender not found. It may have been removed in a recent update.');
        }
      })
      .catch(function (err) {
        showError('Could not load this tender: ' + err.message);
      });
  }
</script>
</body>
</html>
